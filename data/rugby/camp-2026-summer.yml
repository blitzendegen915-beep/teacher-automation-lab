# 2026年度 夏合宿。この1ファイルと roster/expenses から全書類を生成する。
# 数値を直接書き換えてよいのはこのファイルだけ。生成物は毎回作り直すこと。
id: 2026-summer
name: 2026年度 夏季合宿
venue: 菅平ホテル
start: 2026-08-01
end: 2026-08-07

# 食事の課金規約: 「1泊3食」は夜N泊分で、昼食N・夕食N・宿泊N・朝食N+1を含む。
# したがって初日は朝食なし、最終日は夕食・宿泊なし、最終日の昼食だけが枠外。
meal_rule: stay3

# 途中合流者は合流日の夕食からカウントする（2026年度の運用）
late_join_meal: dinner

special_days:
  bbq: 2026-08-06
  extra_lunch: 2026-08-07

# 菅平ホテルの単価（2026/08/07 請求書の実績）
hotel_rates:
  stay3: 9130      # 1泊3食
  breakfast: 1760  # 増朝食
  lunch: 1100      # 増昼食
  dinner: 2200     # 増夕食
  lodging: 4950    # 増宿泊
  bbq: 1100
ground_fees:      # 面数ベース・人数と無関係
  - {unit: 5500, count: 3}
  - {unit: 11000, count: 8}

# 引率の大人。生徒と同じ規約（初日朝食なし・最終日夕食なし）を適用する。
# 顧問・コーチの帯同。to_meal: dinner は「その日の夕食まで＝その夜も宿泊」の意。
# コーチの日程は畠山先生の申告（A:8/1〜2 全日、B:8/3〜5 全日）に基づく。
# ただし畠山先生がホテルへ申告した指導者の日別人数とは整合しない日があり、
# 個人単位の割り当ては未確認。check がその差を毎回報告する。
adults:
  - {name: 畠山 和真, role: 顧問, from: 2026-08-01, to: 2026-08-07}
  - {name: 占部 涼也, role: 顧問, from: 2026-08-05, from_meal: dinner, to: 2026-08-07}
  - {name: コーチA,   role: コーチ, from: 2026-08-01, to: 2026-08-02, to_meal: dinner}
  - {name: コーチB,   role: コーチ, from: 2026-08-03, to: 2026-08-05, to_meal: dinner}

# 畠山先生がホテルへ申告した日別人数（この数字で請求が確定している）。
# 名簿から計算した人数と食い違う場合は check が警告する。
submitted_headcount:
  2026-08-01: 43
  2026-08-02: 43
  2026-08-03: 41
  2026-08-04: 42
  2026-08-05: 44
  2026-08-06: 44
  2026-08-07: 44
hotel_invoice_total: 2555520
# 請求書と名簿ベースの再計算は ¥1,320 だけ食い違う。内訳は以下で、実害はない。
#  ・ホテルは257人泊＋単発(増朝食1・増夕食1・増宿泊1 計¥8,910)として請求。
#    名簿ベースでは同じ滞在を258人泊とまとめて数えるため、差は¥220のみ。
#  ・増昼食が請求43名に対し名簿ベースは44名（差¥1,100）。
# 支払は請求書額で確定済み。会計はホテル請求額を正とする。

bus:
  vendor: 国際興業
  quote: 445200
  extras_pending: true   # 有料道路代・駐車場代が後日実費請求

# 保護者から徴収した1人あたりの内訳（2026/07/09 配布の案内書ベース）
collection:
  lodging_meals: 55020
  extra_lunch: 1100
  bbq: 1100
  ground: 2360
  transport: 10480
  misc_per_day: 1000
  reserve: 1000
  coach_fee: 1030        # 選手のみ負担
  transport_return_only: 5180  # 途中参加者の帰路バスのみ
